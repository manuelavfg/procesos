<section class="auditoria-container">
    <h1>Auditoría</h1>
    <hr>
    
    <div class="search-container">
        <mat-form-field appearance="outline">
          <mat-label>Buscar artículo</mat-label>
          <input matInput [(ngModel)]="searchTerm" (keyup)="applyFilter()" placeholder="Texto a buscar">
        </mat-form-field>
      </div>

		<div class="table-container">
      <table mat-table [dataSource]="dataSource">
                  
        <ng-container matColumnDef="nombreusuario">
          <th mat-header-cell *matHeaderCellDef> Nombre </th>
          <td mat-cell *matCellDef="let element"> {{element.nombreusuario}} </td>
        </ng-container>
    
        <ng-container matColumnDef="cedulausuario">
          <th mat-header-cell *matHeaderCellDef> Cedula </th>
          <td mat-cell *matCellDef="let element"> {{element.cedulausuario}}</td>
        </ng-container>
    
        <ng-container matColumnDef="correousuario">
          <th mat-header-cell *matHeaderCellDef>Correo</th>
          <td mat-cell *matCellDef="let element"> {{element.correousuario}} </td>
        </ng-container>
    
        <ng-container matColumnDef="telefonousuario">
          <th mat-header-cell *matHeaderCellDef>Teléfono</th>
          <td mat-cell *matCellDef="let element"> {{element.telefonousuario}} </td>
        </ng-container>

        <ng-container matColumnDef="cargopermiso">
          <th mat-header-cell *matHeaderCellDef> Permiso </th>
          <td mat-cell *matCellDef="let element"> {{element.cargopermiso}} </td>
        </ng-container>
    
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    
      <mat-paginator [pageSizeOptions]="[5]"
                     showFirstLastButtons
                     aria-label="Select page of Articles">
      </mat-paginator>
    </div>

      <div class="button-container">
        <button  mat-raised-button><a href="/auditoria/editar-usuario">Editar usuario</a></button>
        <button  mat-raised-button><a href="/auditoria/agg-usuario">Añadir usuario</a></button>
        <button mat-raised-button (click)="abrirReporte()" >Generar reporte</button>
      </div>
</section>
