<section class="cuentas-container">
    <h1>Cuentas por cobrar</h1>
    <hr>

    <div class="search-container">
        <mat-form-field appearance="outline">
          <mat-label>Buscar artículo</mat-label>
          <input matInput [(ngModel)]="searchTerm" (keyup)="applyFilter()" placeholder="Texto a buscar">
        </mat-form-field>
      </div>

    <div class="table-container">
      <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="codigocuentascobrar">
          <th mat-header-cell *matHeaderCellDef>Codigo</th>
          <td mat-cell *matCellDef="let element"> {{element.codigocuentascobrar}} </td>
        </ng-container>

        <ng-container matColumnDef="nombreclientes">
          <th mat-header-cell *matHeaderCellDef> Proveedor </th>
          <td mat-cell *matCellDef="let element"> {{element.nombreclientes}} </td>
        </ng-container>
    
        <ng-container matColumnDef="numerofactura">
          <th mat-header-cell *matHeaderCellDef> Número de factura </th>
          <td mat-cell *matCellDef="let element"> {{element.numerofactura}} </td>
        </ng-container>
    
        <ng-container matColumnDef="total_pagado">
          <th mat-header-cell *matHeaderCellDef> Monto a cobrar </th>
          <td mat-cell *matCellDef="let element"> ${{element.total_pagado}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    
      <mat-paginator [pageSizeOptions]="[5]"
                     showFirstLastButtons
                     aria-label="Select page of Articles">
      </mat-paginator>
      </div>

      <button mat-raised-button  style="margin-left: 55rem">Generar Reporte</button>

</section>
