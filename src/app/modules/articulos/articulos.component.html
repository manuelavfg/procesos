<section class="articulos-container">
		<h1>Artículos</h1>
		<hr>

		<div class="search-container">
			<mat-form-field appearance="outline">
			  <mat-label>Buscar artículo</mat-label>
			  <input matInput [(ngModel)]="searchTerm" (keyup)="applyFilter()" placeholder="Texto a buscar">
			</mat-form-field>
		  </div>

		<div class="table-container">
				<table mat-table [dataSource]="dataSource">
										
					<ng-container matColumnDef="descripcionarticulo">
						<th mat-header-cell *matHeaderCellDef> Producto </th>
						<td mat-cell *matCellDef="let element"> {{element.descripcionarticulo}} </td>
					</ng-container>
			
					<ng-container matColumnDef="tipoarticulo">
						<th mat-header-cell *matHeaderCellDef> Unidad </th>
						<td mat-cell *matCellDef="let element"> {{element.tipoarticulo}} </td>
					</ng-container>
			
					<ng-container matColumnDef="existenciaarticulo">
						<th mat-header-cell *matHeaderCellDef> Cantidad </th>
						<td mat-cell *matCellDef="let element"> {{element.existenciaarticulo}} </td>
					</ng-container>
			
					<ng-container matColumnDef="codigoarticulo">
						<th mat-header-cell *matHeaderCellDef> Código </th>
						<td mat-cell *matCellDef="let element"> {{element.codigoarticulo}} </td>
					</ng-container>

					<ng-container matColumnDef="costoarticulo">
						<th mat-header-cell *matHeaderCellDef> Precio </th>
						<td mat-cell *matCellDef="let element"> {{element.costoarticulo}} </td>
					</ng-container>

                    <ng-container matColumnDef="entradaarticulo">
						<th mat-header-cell *matHeaderCellDef> Fecha de entrada</th>
						<td mat-cell *matCellDef="let element"> {{element.entradaarticulo}} </td>
					</ng-container>

                    <ng-container matColumnDef="salidaarticulo">
						<th mat-header-cell *matHeaderCellDef> Fecha de salida </th>
						<td mat-cell *matCellDef="let element"> {{element.salidaarticulo}} </td>
					</ng-container>
			
					<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
					<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
				</table>
			
				<mat-paginator [pageSizeOptions]="[5]"
											 showFirstLastButtons
											 aria-label="Select page of Articles">
				</mat-paginator>
			</div>

			<div class="add-product">
				<button  mat-raised-button style="color: black;" (click)="this.router.navigate(['/articulos/agregar-producto'])" >Añadir producto</button>
				<button  mat-raised-button style="color: black;" (click)="this.router.navigate(['/articulos/editar-producto'])">Editar producto</button>
                <button  mat-raised-button (click)="abrirReporte()" style="margin-right: 10px">Generar Reporte</button>

			</div>
</section>
