<section class="editar-container">
    <section class="form-card">
        <h1>Editar producto</h1>
        <p>En esta sección podrá editar los artículos</p>
      <form (ngSubmit)="onInsert()"  [formGroup]="articuloForm" method="post">
        <div class="form-container">

            <mat-form-field appearance="outline">
                <mat-label>Producto</mat-label>
                <input type="text"
                       placeholder="Proveedor"
                       aria-label="text"
                       matInput
                       [formControl]="producto"
                       [matAutocomplete]="auto">

                <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete" (optionSelected)="onOptionSelected($event)">
                  <mat-option *ngFor="let option of filteredOptions | async; let i = index" [value]="option" [id]="'option-' + i">
                    {{option}}
                  </mat-option>
                </mat-autocomplete>
              </mat-form-field> 
 


                  <mat-form-field appearance="outline">
                    <mat-label>Descripcion</mat-label>
                    <input formControlName="descripcionarticulo" matInput placeholder="Ingrese Descripcion">
                  </mat-form-field>

    
                  <mat-form-field appearance="outline">
                    <mat-label>Unidad</mat-label>
                    <input formControlName="tipoarticulo" matInput placeholder="Ingrese unidad">
                  </mat-form-field>


                  <mat-form-field appearance="outline">
                    <mat-label>Precio</mat-label>
                    <input type="number" formControlName="costoarticulo" matInput placeholder="Ingrese precio">
                  </mat-form-field>
                </div>
                <div>
                  <button mat-raised-button type="submit">Editar producto</button>                    
                </div>
      </form>
    </section>
</section>
