<h2 mat-dialog-title style="justify-content: center; display: flex; margin-top: 20px;">Generar Reporte</h2>
<mat-dialog-content class="mat-typography">
    
        <!-- seccion de filtrado/tipo de reporte -->
         <div style=" justify-content: center; display: flex; flex-direction: column; align-items: center;">
             <h3>Seleccionar tipo de reporte</h3>
             <mat-form-field style="width: 320px;" appearance="outline">  
                 <mat-label>Tipo de Reporte</mat-label>
                 <mat-select (selectionChange)="onSelectionChange($event)">
                     <mat-option *ngFor="let option of data.options" [value]="option">
                         {{option}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>


        
            <!-- Sección de filtrado adicional -->
    <div style="margin-top: 25px; padding: 15px; border: 1px solid #e0e0e0; border-radius: 8px;">
        <mat-radio-group [(ngModel)]="filtradoActivo" style="margin-bottom: 15px; display: flex; gap: 20px;">
            <mat-radio-button value="con" style="margin-right: 15px;">Con filtrado avanzado</mat-radio-button>
            <mat-radio-button value="sin">Sin filtrado avanzado</mat-radio-button>
        </mat-radio-group>

        <div *ngIf="filtradoActivo === 'con' " style="margin-top: 20px;">
            <mat-form-field style="width: 100%; margin-bottom: 15px;" appearance="outline">
                <mat-label>Tipo de filtro</mat-label>
                <mat-select (valueChange)="obtenerParametro($event)" [(value)]="selectedTipoFiltro" style="width: 300px;">
                    <mat-option  *ngFor="let filtro of data.filtrado; let i = index" [value]="valores[i]">
                        {{filtro}}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <h3 *ngIf="selectedTipoFiltro === 'fecha'" style="margin-top: 0;">Seleccionar Rango</h3>
            <!-- Controles condicionales -->
            <div *ngIf="selectedTipoFiltro === 'fecha'" style="display: flex; gap: 20px; margin-top: 15px; justify-content: center;">
                <mat-form-field style="width: 200px;" appearance="outline">
                    <input matInput [matDatepicker]="pickerInicio" 
                           placeholder="Fecha inicio (DD-MM-AAAA)"
                           [formControl]="fechaInicio">
                    <mat-datepicker-toggle matSuffix [for]="pickerInicio"></mat-datepicker-toggle>
                    <mat-datepicker #pickerInicio></mat-datepicker>
                </mat-form-field>

                <mat-form-field style="width: 200px;" appearance="outline">
                    <input matInput [matDatepicker]="pickerFin" 
                           placeholder="Fecha fin (DD-MM-AAAA)"
                           [formControl]="fechaFin">
                    <mat-datepicker-toggle matSuffix [for]="pickerFin"></mat-datepicker-toggle>
                    <mat-datepicker #pickerFin></mat-datepicker>
                </mat-form-field>
            </div>

            <div *ngIf="selectedTipoFiltro === 'opciones2'">
                <h3 style="margin-top: 0;">Seleccionar {{data.label2}}</h3>
                <mat-form-field style="width: 320px;" appearance="outline">
                    <mat-label>Opcion</mat-label>
                <input type="text"
                aria-label="text"
                matAutocompletePosition="above"
                matInput
                [formControl]="busqueda2"
                [matAutocomplete]="auto">

               <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete" (optionSelected)="onOptionSelected2($event)">
                   <mat-option *ngFor="let option of filteredOptions2 | async; let i = index" [value]="option" [id]="'option-' + i">
                  {{option}}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field> 
            </div>

            <div *ngIf="selectedTipoFiltro === 'opciones'">
                <h3 style="margin-top: 0;">Seleccionar {{data.label}}</h3>
                <mat-form-field style="width: 320px;" appearance="outline">
                    <mat-label>Opcion</mat-label>
                <input type="text"
                aria-label="text"
                matAutocompletePosition="above"
                matInput
                [formControl]="busqueda"
                [matAutocomplete]="auto">

               <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete" (optionSelected)="onOptionSelected($event)">
                   <mat-option *ngFor="let option of filteredOptions | async; let i = index" [value]="option" [id]="'option-' + i">
                  {{option}}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field> 
            </div>

            <h3 *ngIf="selectedTipoFiltro === 'numerico'" style="margin-top: 0;">Seleccionar Rango</h3>

            <div *ngIf="selectedTipoFiltro === 'numerico'" style="display: flex; gap: 20px; margin-top: 15px; justify-content: center;">
                <mat-form-field style="width: 200px;" appearance="outline">
                    <input [formControl]="fechaInicio"  matInput type="number" placeholder="Valor mínimo">
                </mat-form-field>
                <mat-form-field style="width: 200px;"appearance="outline">
                    <input [formControl]="fechaFin" matInput type="number" placeholder="Valor máximo">
                </mat-form-field>
            </div>
        </div>
    </div>

</mat-dialog-content>
<mat-dialog-actions align="center">
    <button mat-button mat-dialog-close>Cancelar</button>
    <button mat-button [mat-dialog-close]="true" cdkFocusInitial (click)="Print()" >Generar</button>
</mat-dialog-actions>
