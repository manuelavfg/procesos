<section class="password-container">

    <div class="image"></div>

    <section class="form-card">
        <h1>Recuperar Contraseña</h1>
        <p>Ingresa tu email para recuperar tu contraseña</p>

          <div>
            <form class="form-container" (ngSubmit)="onInsert()" [formGroup]="recoveryForm" action="">
              <mat-form-field appearance="outline">
                <input matInput placeholder="Password" [type]="hide ? 'password' : 'text'" formControlName="contrasena1" required>
                <mat-icon matSuffix (click)="hide = !hide">{{hide ? 'visibility_off' : 'visibility'}}
                </mat-icon><mat-hint *ngIf="!recoveryForm.value">Enter your password</mat-hint>
                </mat-form-field>
                <mat-form-field appearance="outline">
                  <input matInput placeholder="Password" [type]="hide2 ? 'password' : 'text'" formControlName="contrasena2" required>
                  <mat-icon matSuffix (click)="hide2 = !hide2">{{hide2 ? 'visibility_off' : 'visibility'}}
                  </mat-icon><mat-hint *ngIf="!recoveryForm.value">Enter your password</mat-hint>
                </mat-form-field>
                <button mat-raised-button type="submit">Enviar confirmación</button>

            </form>

            </div>
    </section>

</section>
