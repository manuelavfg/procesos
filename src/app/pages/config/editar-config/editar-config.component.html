<section class="editar-container">
    <section class="form-card">
        <h1>Editar datos fiscales</h1>
        <p>En esta sección podrá editar los datos de la empresa</p>
    
        <div>
          <form [formGroup]="articuloForm" (ngSubmit)="onInsert()" class="form-container" action="">
            <mat-form-field appearance="outline">
              <mat-label>Tasa de cammbio</mat-label>
              <input formControlName="tasaconfig" matInput placeholder="Ingrese tasa">
                  </mat-form-field>            
    
                  <mat-form-field appearance="outline">
                    <mat-label>Nombre de la empresa</mat-label>
                    <input formControlName="nombreconfig" matInput placeholder="Ingrese nuevo nombre">
                  </mat-form-field>
    
                  <mat-form-field appearance="outline">
                    <mat-label>Correo eléctrónico</mat-label>
                    <input formControlName="correoconfig" matInput placeholder="Ingrese correo">
                  </mat-form-field>

                  <mat-form-field appearance="outline">
                    <mat-label>Teléfono</mat-label>
                    <input formControlName="telefonoconfig" matInput placeholder="Ingrese teléfono">
                  </mat-form-field> 

                  <mat-form-field appearance="outline">
                    <mat-label>IVA</mat-label>
                    <input formControlName="ivaconfig" matInput placeholder="Ingrese porcentaje de IVA">
                  </mat-form-field>
                  <button mat-raised-button type="submit">Editar datos</button>
                </form>
        </div>
    </section>
</section>
